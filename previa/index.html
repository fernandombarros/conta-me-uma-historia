<!doctype html>
<html lang="pt-PT" data-design="kids" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pré-visualização · Conta-me Uma História</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/style.css?v=6">
  <link rel="stylesheet" href="../assets/kids.css?v=7">
  <style>
    .preview { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; }
    .preview h1 { font-size: clamp(30px, 5vw, 44px); margin: 8px 0 12px; }
    .preview .note { background: #fff7d6; border-radius: 16px; padding: 16px 20px; margin: 16px 0 36px; }
    .preview h2 { font-size: 24px; margin: 40px 0 12px; }
    .preview ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .preview li { background: #fff; border-radius: 16px; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
    .preview li b { font-size: 18px; }
    .preview li small { color: #6b5f55; display: block; }
    .preview .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .preview .badge { background: #2b2a72; color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 13px; margin-left: 8px; }
    .preview iframe { width: 100%; height: 80vh; min-height: 520px; border: 2px dashed #cfc6b8; border-radius: 16px; background: #fff; }
    .preview .empty { color: #6b5f55; }
  </style>
</head>
<body>
  <main class="preview">
    <p class="eyebrow">Só para rever</p>
    <h1>Pré-visualização</h1>
    <div class="note">
      <p>Aqui vê as páginas do site <b>como ficam com os rascunhos incluídos</b>. Este endereço não aparece em nenhum menu do site, mas quem tiver o link consegue vê-lo.</p>
    </div>

    <h2>Rascunhos</h2>
    <ul id="drafts"></ul>

    <h2>Página inicial</h2>
    <iframe src="../index.html?previa=1" title="Página inicial, com rascunhos"></iframe>

    <h2>Ler</h2>
    <iframe src="../ler.html?previa=1" title="Página Ler, com rascunhos"></iframe>
  </main>

  <script src="../assets/data.js?v=4"></script>
  <script>
    const drafts = ILLUSTRATED.filter((s) => s.draft);
    const list = document.getElementById("drafts");
    list.innerHTML = drafts.length
      ? drafts.map((s) => `
          <li>
            <div>
              <b>${s.title}${s.featured ? '<span class="badge">Em destaque</span>' : ""}</b>
              <small>${s.blurb}</small>
            </div>
            <div class="links">
              <a class="btn btn-primary" href="../livro.html?h=${s.book}">Abrir o livro</a>
              <a href="../assets/downloads/${s.book}.epub">EPUB</a>
              <a href="../assets/downloads/${s.book}.pdf">PDF</a>
            </div>
          </li>`).join("")
      : '<p class="empty">Não há rascunhos de momento.</p>';
  </script>
</body>
</html>
